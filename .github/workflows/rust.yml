name: CI

on:
  pull_request:
    branches: [ main, 'rc-*' ]

env:
  CARGO_TERM_COLOR: always

# Note: Main test suites are in separate workflows:
# - lint.yml: Format and clippy checks
# - unit-tests.yml: Unit and integration tests (all platforms; this also
#   builds the library on Linux, macOS and Windows)

jobs:
  compiler-baseline:
    name: MSRV native and WASM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The baseline is Cargo.toml's `rust-version` — the single source of
      # truth. Raising the floor is a one-line manifest change; this job fails
      # when the declared floor no longer builds (own code or a dependency's).
      - name: Read declared rust-version
        id: msrv
        run: |
          msrv=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "saorsa-core") | .rust_version')
          test -n "$msrv" && test "$msrv" != null || { echo "::error::rust-version missing from Cargo.toml"; exit 1; }
          echo "Declared rust-version: $msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check native library on the declared compiler baseline
        run: cargo check --locked --lib --all-features
      - name: Check portable client library on the declared compiler baseline
        run: cargo check --locked --lib --no-default-features --target wasm32-unknown-unknown

  security_audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-audit
      - run: cargo install cargo-audit
      - run: cargo audit
