[package]
name = "saorsa-core"
# 0.10.3: postcard serialization migration (PR #14)
# 0.10.4: refocus on phonebook + trust signals, remove user-facing APIs (PR #15)
# 0.11.0: remove feature gates — adaptive/trust/placement always compiled
# 0.11.1: fix Kademlia protocol violations in iterative lookups
# 0.12.0: configurable max_message_size, bump saorsa-transport to 0.22.0
# 0.12.1: patch release
# 0.13.0: multi-channel transport, PeerId ownership, BLAKE3 migration (PR #32)
# 0.14.0: user-agent DHT gating — exclude ephemeral clients from DHT routing table
# 0.14.1: fix deterministic identity generation to use real ML-DSA keypairs
# 0.15.0: routing table single-source-of-truth fixes
# 0.16.0: delegate transport addressing to saorsa-transport's TransportAddr (PR #39)
# 0.17.0: remove configuration system, streamline network setup
# 0.17.1: keep logging macros crate-internal, strip from public API
# 0.17.2: bump saorsa-transport to 0.27
# 0.18.0: harden send_message reconnect logic
# 0.18.1: enforce address invariants in KBucket::add_node
# 0.19.0: NAT traversal timeouts, dual-stack normalisation, connection reliability
# 0.20.0: simplify IP diversity, stale-peer fixes, cache atomicity improvements
# 0.21.0: penalty-only trust model, distance-sorted lookup candidates, stale docs cleanup
# 0.22.0: MASQUE relay data plane, upgrade saorsa-transport to 0.31.0
# 0.24.0: upgrade saorsa-transport to 0.33.0
# 0.24.1: release candidate fixes
version = "0.27.3"
edition = "2024"
authors = ["Saorsa Labs Limited <david@saorsalabs.com>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/WithAutonomi/saorsa-core"
repository = "https://github.com/WithAutonomi/saorsa-core"
description = "Saorsa - Core P2P networking library with DHT, QUIC transport, and post-quantum cryptography"
keywords = ["p2p", "networking", "dht", "quic", "decentralized"]
categories = ["network-programming", "asynchronous", "cryptography"]
readme = "README.md"
documentation = "https://docs.rs/saorsa-core"

# Docs.rs configuration to handle build script issues
[package.metadata.docs.rs]
no-default-features = false
default-target = "x86_64-unknown-linux-gnu"

[workspace]
resolver = "2"

[features]
default = ["native"]
# Native networking and persistence; identity, addresses, crypto and lookup are portable.
native = ["saorsa-transport/default", "dep:tokio", "dep:uuid", "dep:dirs", "dep:tempfile", "dep:tokio-util", "dep:parking_lot", "dep:dashmap", "dep:lru", "dep:async-trait", "dep:bytes"]

[dependencies]
# Core async and serialization
tokio = { version = "1.49", features = ["full"] , optional = true }
futures = "0.3"
async-trait = { version = "0.1", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
uuid = { version = "1.14", features = ["v4", "serde"] , optional = true }
bytes = { version = "1.10", optional = true }
hex = "0.4"

# Cryptography - Primary source of truth: saorsa-pqc
saorsa-pqc = { version = "0.5", git = "https://github.com/saorsa-labs/saorsa-pqc", rev = "6d57e9dd73d537182fe85b0050e809a224f21154" }
rand = "0.8"
blake3 = "1.6"

# Performance optimization
parking_lot = { version = "0.12", optional = true }
once_cell = "1.21"
dashmap = { version = "6", optional = true }

# Networking
# Cross-repository WebRTC Direct support. Pin the draft dependency so this
# branch builds in CI until the corresponding saorsa-transport release lands.
saorsa-transport = { version = "0.36.3", git = "https://github.com/WithAutonomi/saorsa-transport", rev = "0ce2ea865242942b09a40cd0cea03ff0d0557065", default-features = false }

# Core-specific dependencies
dirs = { version = "6.0", optional = true }
postcard = { version = "1.1.3", features = ["use-std"] }
lru = { version = "0.16", optional = true }
tempfile = { version = "3.17", optional = true }
tokio-util = { version = "0.7", features = ["rt"] , optional = true }

# Fix wyz 0.5.0 compatibility issue with tap 1.0 (CI build failure)
wyz = "=0.5.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.17"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
